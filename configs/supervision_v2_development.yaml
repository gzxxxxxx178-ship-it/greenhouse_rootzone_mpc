  - {candidate_id: V2C005, trusted_observation_gain: 0.65, uncertainty_growth_per_step: 0.00025, maximum_uncertainty: 0.006, start_threshold: 0.205}
  - {candidate_id: V2C006, trusted_observation_gain: 0.65, uncertainty_growth_per_step: 0.00050, maximum_uncertainty: 0.010, start_threshold: 0.205}
  - {candidate_id: V2C007, trusted_observation_gain: 0.65, uncertainty_growth_per_step: 0.00050, maximum_uncertainty: 0.010, start_threshold: 0.215}
